project:
  type: book
  output-dir: _book

# lang no nivel raiz (NAO aninhar em book:)
lang: pt

book:
  title: "Manual de Eletrônica"
  subtitle: "Da lei de Ohm à máquina de estados"
  author: "Vitor"
  date: today
  date-format: "DD/MM/YYYY"
  search: true
  repo-url: https://github.com/VitorMattosDev/manual-eletronica
  repo-branch: main
  repo-actions: [edit, issue]
  page-footer:
    left: "Manual de Eletrônica"
    right: "Licença CC BY-SA 4.0"
  chapters:
    - index.qmd

    # ===== Fase 1 - Fundamentos Eletricos =====
