bibliography: referencias.bib
csl: abnt.csl

filters:
  # danmackinlay/tikz SEMPRE antes de quarto
  - danmackinlay/tikz
  - quarto

tikz:
  svg-engine: dvisvgm
  cache: true

format:
  html:
    theme: [cosmo, styles.css]
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
  pdf:
    documentclass: scrbook
    papersize: a4
    number-sections: true
    toc-depth: 2
    include-in-header:
      text: |
        \usepackage{float}
